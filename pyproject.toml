[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scingest-core"
version = "0.0.1"
description = "Build Seurat and Scanpy objects from GEO accessions and local 10x directories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Saikat" }]
keywords = ["single-cell", "scRNA-seq", "GEO", "Seurat", "Scanpy", "AnnData"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.10",
  "scanpy>=1.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "h5py>=3.10",
  "lxml>=5.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2.0"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy", "pip-licenses"]

[project.scripts]
scingest = "scingest_core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["core/scingest_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
markers = [
  "golden: requires downloaded GEO fixtures",
  "requires_r: requires an R environment with Seurat",
]
