name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,server]"
      - run: ruff check .
      - run: pytest -m "not golden and not requires_r" -v

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,server]"
      # Fail the build if any dependency carries an unexpected copyleft license.
      # The R environment is intentionally NOT installed here: it is GPL, it is
      # never distributed with the app, and it must not enter this check.
      - name: Check Python dependency licenses
        run: |
          pip-licenses --format=markdown --with-urls > THIRD_PARTY_NOTICES_generated.md
          pip-licenses --fail-on="GPL;AGPL;LGPL;SSPL;BUSL" --ignore-packages scingest-core
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES_generated.md

  no-data-committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GEO data must never enter the repository (legal audit 6.1).
      - name: Assert no data files are tracked
        run: |
          if git ls-files | grep -E '\.(h5ad|rds|qs|loom|mtx|h5Seurat)(\.gz)?$|barcodes\.tsv|features\.tsv|matrix\.mtx'; then
            echo "::error::Data files are tracked in git. See docs/LICENSING_AND_LEGAL_AUDIT.md 6.1"
            exit 1
          fi
          echo "Clean — no data files tracked."
